name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installa dipendenze
        run: npm install

      - name: Compila e offusca con Vite
        run: npm run build

      - name: Genera progetto Android e attiva schermo intero immersivo
        run: |
          npx cap add android
          cat << 'EOF' > android/app/src/main/java/it/puzzlehero/app/MainActivity.java
          package it.puzzlehero.app;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemBars();
                  }
              }

              private void hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  }
              }
          }
          EOF
          npx cap sync android

      - name: Compila APK Android (Debug)
        run: |
       mkdir -p ~/.android
       echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
       cd android
       chmod +x gradlew
       ./gradlew assembleDebug

      - name: Carica APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleHero-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
